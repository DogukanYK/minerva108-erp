# ESKİ sunucu: /etc/nginx/conf.d/minerva-freeze-map.conf
# Yazma dondurma için değişken.  Tek başına hiçbir şeyi değiştirmez;
# sites-available/minerva-freeze bu değişkeni kullanır.  Kalıcı durabilir.
map $request_method $minerva_write {
    default 0;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
}
