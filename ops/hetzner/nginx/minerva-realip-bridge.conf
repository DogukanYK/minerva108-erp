# /etc/nginx/conf.d/minerva-realip-bridge.conf  — YALNIZ köprü döneminde
#
# Eski Turhost sunucusu (136.144.251.26) cutover sonrası 7-14 gün reverse-proxy
# köprüsü olarak kalır: DNS'i güncellenmemiş istemciler eski IP'ye gelir, eski
# nginx isteği buraya iletir.  Bu istekler TCP düzeyinde 136.144.251.26'dan
# gelir; realip modülü X-Forwarded-For zincirinden gerçek istemci IP'sini alıp
# $remote_addr'a yazar → X-Real-IP (PDKS ofis allowlist'i, routers/pdks.py),
# limit_req zone'ları ve access log doğru IP'yi görür.
#
# Köprü kapatılınca (Turhost iptal) bu dosya SİLİNMELİ.
set_real_ip_from 136.144.251.26;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;
