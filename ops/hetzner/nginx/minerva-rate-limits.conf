# Şahit numune / Amazon ürün görselleri — public, kimlik doğrulaması yok.
# Amazon'un flat-file crawl'ı ~540 istek/tek seferlik; bu limit onu asla
# etkilemez.  Amacı: rastgele biri bu yolu bombalarsa nginx ucuza (Python
# sürecine hiç dokunmadan) sınırlasın.  Zone 10m ~160k benzersiz IP izler.
limit_req_zone $binary_remote_addr zone=pubimg:10m rate=60r/s;

# Ürün yorumu davet formu (/yorum/*) — public, kimlik doğrulaması yok, ses
# yükleme dahil.  Uygulama tarafındaki @limiter.limit("5/hour") YALNIZ
# aynı token'ı (URL'yi) tekrar tekrar döven birine karşı korur — slowapi
# varsayılanı isteğin ÇÖZÜLMÜŞ yoluna göre sayar, farklı token'larla gelen
# bir sel o dekoratörle YAKALANMAZ.  Asıl, IP-bazlı ve URL'den bağımsız
# koruma burası: uvicorn TEK süreç çalışıyor, bu yolu biri bombalarsa
# Python'a hiç ulaşmadan burada kesilir (routers/product_images.py'nin
# aynı dersi).  10r/m = IP başına dakikada 10 istek (burst=5 ile kısa
# patlamalara izin verir, sonra yavaşlatır) — gerçek bir ziyaretçinin
# birkaç deneme/yeniden kayıt döngüsünü asla etkilemez.
limit_req_zone $binary_remote_addr zone=review:10m rate=10r/m;
