<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minerva108 — Giriş</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy:  #2C2C73;
      --gold:  #b8965a;
      --gold2: #d4af72;
      --cream: #f5f0e8;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', sans-serif;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(184,150,90,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(44,44,115,0.06) 0%, transparent 55%);
    }

    /* ── Card ── */
    .login-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow:
        0 4px 6px rgba(0,0,0,0.04),
        0 12px 40px rgba(44,44,115,0.10),
        0 1px 0px rgba(184,150,90,0.20);
      padding: 3rem 2.75rem 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    /* ── Brand ── */
    .brand-area {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .brand-emblem {
      width: 52px;
      height: 52px;
      background: var(--navy);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .brand-emblem svg { width: 28px; height: 28px; }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin: 0;
    }

    .brand-sub {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    /* ── Divider ── */
    .gold-divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      border-radius: 2px;
      margin: 0.9rem auto 0;
    }

    /* ── Form ── */
    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .form-control {
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      color: #1f2937;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
    }

    .form-control:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(44,44,115,0.10);
      background: var(--white);
      outline: none;
    }

    /* ── Remember me ── */
    .form-check-input:checked {
      background-color: var(--navy);
      border-color: var(--navy);
    }

    .form-check-label {
      font-size: 0.88rem;
      color: #4b5563;
    }

    /* ── Button ── */
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(44,44,115,0.25);
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      background: #23236b;
      box-shadow: 0 4px 16px rgba(44,44,115,0.30);
    }

    .btn-login:active { transform: scale(0.99); }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* ── Footer text ── */
    .card-footer-text {
      text-align: center;
      font-size: 0.78rem;
      color: #9ca3af;
      margin-top: 1.75rem;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .toast-msg {
      min-width: 280px;
      max-width: 360px;
      padding: 0.85rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jost', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: slideUp 0.3s ease;
    }

    .toast-error   { background: #fff1f1; color: #b91c1c; border-left: 4px solid #ef4444; }
    .toast-success { background: #f0fdf4; color: #15803d; border-left: 4px solid #22c55e; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="stylesheet" href="/static/mobile.css" />
  <script src="/static/mobile.js" defer></script>
</head>
<body>

  <div class="login-card">
    <!-- Brand -->
    <div class="brand-area">
      <div class="brand-emblem">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 3L4 8.5V19.5L14 25L24 19.5V8.5L14 3Z" stroke="#b8965a" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M14 3V25M4 8.5L24 19.5M24 8.5L4 19.5" stroke="#b8965a" stroke-width="1.1" stroke-opacity="0.45"/>
        </svg>
      </div>
      <h1 class="brand-name">Minerva108</h1>
      <p class="brand-sub">Kozmetik &nbsp;·&nbsp; ERP Sistemi</p>
      <div class="gold-divider"></div>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Kullanıcı Adı</label>
        <input
          type="text"
          class="form-control"
          id="username"
          placeholder="kullanici.adi"
          autocomplete="username"
          required
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Şifre</label>
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="rememberMe" />
        <label class="form-check-label" for="rememberMe">
          Beni Hatırla <span style="color:#9ca3af;font-size:0.78rem;">(30 gün)</span>
        </label>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Sisteme Giriş Yap
      </button>
    </form>

    <p class="card-footer-text">
      &copy; 2025 Minerva108 Kozmetik — Tüm hakları saklıdır.
    </p>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script>
    function showToast(message, type = 'error') {
      const container = document.getElementById('toast-container');
      const icon = type === 'error' ? '✕' : '✓';
      const toast = document.createElement('div');
      toast.className = `toast-msg toast-${type}`;
      toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.transition = 'opacity 0.4s';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username   = document.getElementById('username').value.trim();
      const password   = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const btn        = document.getElementById('loginBtn');

      if (!username || !password) {
        showToast('Lütfen kullanıcı adı ve şifrenizi giriniz.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, remember_me: rememberMe }),
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.detail || 'Giriş başarısız. Lütfen tekrar deneyin.');
          return;
        }

        showToast('Giriş başarılı! Yönlendiriliyorsunuz…', 'success');
        setTimeout(() => { window.location.href = data.redirect || '/'; }, 800);

      } catch (err) {
        showToast('Sunucuya bağlanılamadı. Lütfen daha sonra tekrar deneyin.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sisteme Giriş Yap';
      }
    });
  </script>

</body>
</html>
