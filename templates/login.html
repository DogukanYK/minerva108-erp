<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="/static/theme.js"></script>
  <title>Minerva 108 — Giriş</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.png" />
  {% if is_crm %}
  <!-- crm.minerva108.com: CRM PWA kimliği — PWABuilder/TWA bu manifest'i algılar -->
  <link rel="manifest" href="/static/manifest-crm.json" />
  <meta name="apple-mobile-web-app-title" content="Minerva CRM" />
  <link rel="apple-touch-icon" href="/static/images/icon-crm-192.png" />
  {% else %}
  <!-- ims.minerva108.com: ERP/IMS PWA kimliği (ayrı bağımsız uygulama) -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="apple-mobile-web-app-title" content="Minerva108" />
  <link rel="apple-touch-icon" href="/static/images/icon-192.png" />
  {% endif %}
  <meta name="theme-color" content="#232E6E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/dark.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy:  #232E6E;
      --navy-dark: #1A2456;
      --gold:  #C9AC6F;
      --gold2: #D9BE85;
      --cream: #f5f0e8;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', sans-serif;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(201,172,111,0.10) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(35,46,110,0.08) 0%, transparent 55%);
    }

    /* ── Card ── */
    .login-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow:
        0 4px 6px rgba(0,0,0,0.04),
        0 12px 40px rgba(35,46,110,0.12),
        0 1px 0px rgba(201,172,111,0.22);
      padding: 3rem 2.75rem 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    /* ── Brand ── */
    .brand-area {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
      margin: 0 auto 0.6rem;
    }

    .brand-tagline {
      font-size: 0.74rem;
      font-weight: 500;
      color: #6b7280;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin: 0;
    }

    /* ── Divider ── */
    .gold-divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      border-radius: 2px;
      margin: 0.9rem auto 0;
    }

    /* ── Form ── */
    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .form-control {
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      color: #1f2937;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
    }

    .form-control:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(35,46,110,0.12);
      background: var(--white);
      outline: none;
    }

    /* ── Remember me ── */
    .form-check-input:checked {
      background-color: var(--navy);
      border-color: var(--navy);
    }

    .form-check-label {
      font-size: 0.88rem;
      color: #4b5563;
    }

    /* ── Button ── */
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(35,46,110,0.28);
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      background: var(--navy-dark);
      box-shadow: 0 4px 16px rgba(35,46,110,0.32);
    }

    .btn-login:active { transform: scale(0.99); }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* ── Footer text ── */
    .card-footer-text {
      text-align: center;
      font-size: 0.78rem;
      color: #9ca3af;
      margin-top: 1.75rem;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .toast-msg {
      min-width: 280px;
      max-width: 360px;
      padding: 0.85rem 1.1rem;
      border-radius: 10px;
      font-family: 'Jost', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: slideUp 0.3s ease;
    }

    .toast-error   { background: #fff1f1; color: #b91c1c; border-left: 4px solid #ef4444; }
    .toast-success { background: #f0fdf4; color: #15803d; border-left: 4px solid #22c55e; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="stylesheet" href="/static/mobile.css" />
  <script src="/static/mobile.js" defer></script>
  <script src="/static/toast.js" defer></script>
</head>
<body>

  <div class="login-card">
    <!-- Brand -->
    <div class="brand-area">
      <img src="/static/images/logo_full.png" alt="Minerva 108 Vegan Cosmetics" class="brand-logo" />
      <p class="brand-tagline">{{ brand_tagline | default('ERP Sistemi') }}</p>
      <div class="gold-divider"></div>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Kullanıcı Adı</label>
        <input
          type="text"
          class="form-control"
          id="username"
          placeholder="kullanici.adi"
          autocomplete="username"
          required
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Şifre</label>
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="rememberMe" />
        <label class="form-check-label" for="rememberMe">
          Beni Hatırla <span style="color:#9ca3af;font-size:0.78rem;">(30 gün)</span>
        </label>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Sisteme Giriş Yap
      </button>
    </form>

    <p class="card-footer-text">
      &copy; 2026 Minerva 108 Kozmetik — Tüm hakları saklıdır.
    </p>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username   = document.getElementById('username').value.trim();
      const password   = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const btn        = document.getElementById('loginBtn');

      if (!username || !password) {
        showToast('Lütfen kullanıcı adı ve şifrenizi giriniz.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor…';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, remember_me: rememberMe }),
        });

        const data = await res.json();

        if (!res.ok) {
          showToast(data.detail || 'Giriş başarısız. Lütfen tekrar deneyin.');
          return;
        }

        showToast('Giriş başarılı! Yönlendiriliyorsunuz…', 'success');
        setTimeout(() => { window.location.href = data.redirect || '/'; }, 800);

      } catch (err) {
        showToast('Sunucuya bağlanılamadı. Lütfen daha sonra tekrar deneyin.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sisteme Giriş Yap';
      }
    });
  </script>

</body>
</html>
